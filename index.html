<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="game-box">
    <h2>🎯 Number Guessing Game</h2>
    <p>
        Guess a random number between <b>1 – 100</b><br>
        You have <b>10 attempts</b>
    </p>

    <h1>Guess a Number</h1>

    <input type="text" id="userInput" placeholder="Enter your guess"><br><br>

    <button type="submit" id="btn">Submit Guess</button>

    <div class="info">
        <p>Previous Guesses: <span id="guess"></span></p>
        <p>Guesses Remaining: <span id="remaining"          >10</span></p>
        <p id="messageDisplay"></p>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
